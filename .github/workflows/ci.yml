name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      export_images:
        description: Save Docker images as downloadable artifacts (uses GitHub storage)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Deliberately fake values: never attach production secrets to PR checks.
      LIVEKIT_URL: wss://test.invalid
      LIVEKIT_API_KEY: ci-placeholder-key
      LIVEKIT_API_SECRET: ci-placeholder-secret
      GROQ_API_KEY: ci-placeholder-groq
      GOOGLE_API_KEY: ci-placeholder-google
      DEEPSEEK_API_KEY: ci-placeholder-deepseek
      TAVILY_API_KEY: ci-placeholder-tavily
      LLM_PROVIDER: groq
      GRADING_PROVIDER: groq
      PROGRESS_DATABASE_URL: ''
      LOG_DIR: logs
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run mocked regression tests
        run: python -m unittest discover -s tests -v

  web:
    name: Web checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_STANDALONE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          package_json_file: web/package.json
          run_install: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Run mocked regression tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Type check (after Next generates its types)
        run: pnpm typecheck

  docker:
    name: Docker / ${{ matrix.image }}
    needs: [python, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: agent
            dockerfile: Dockerfile
          - image: web
            dockerfile: web/Dockerfile
    env:
      IMAGE: english-practicing-${{ matrix.image }}:${{ github.sha }}
      ARCHIVE: english-practicing-${{ matrix.image }}.tar.gz
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build image (no registry push)
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: docker build --pull --file "$DOCKERFILE" --tag "$IMAGE" .
      - name: Verify non-root image user
        run: |
          user=$(docker image inspect --format '{{.Config.User}}' "$IMAGE")
          test -n "$user" && test "$user" != root && test "$user" != 0
      - name: Agent import smoke test without network or real keys
        if: matrix.image == 'agent'
        run: |
          docker run --rm --network none \
            -e LIVEKIT_URL=wss://test.invalid \
            -e LIVEKIT_API_KEY=ci-placeholder-key \
            -e LIVEKIT_API_SECRET=ci-placeholder-secret \
            -e GROQ_API_KEY=ci-placeholder-groq \
            -e TAVILY_API_KEY=ci-placeholder-tavily \
            --entrypoint python "$IMAGE" \
            -c "import main; print('Agent imports OK; worker not started')"
      - name: Web startup smoke test without network or secrets
        if: matrix.image == 'web'
        run: |
          trap 'docker logs ci-web; docker rm -f ci-web' EXIT
          docker run --detach --name ci-web --network none "$IMAGE"
          docker exec ci-web node -e '
            (async () => {
              for (let attempt = 0; attempt < 30; attempt++) {
                try {
                  const response = await fetch("http://127.0.0.1:3000/login", {
                    signal: AbortSignal.timeout(2000),
                  });
                  if (response.status === 200) {
                    console.log("Web login page OK; no call started");
                    return;
                  }
                } catch {}
                await new Promise(resolve => setTimeout(resolve, 1000));
              }
              throw new Error("Web did not become healthy");
            })().catch(error => { console.error(error); process.exit(1); });
          '
      - name: Export image for manual download
        if: github.event_name == 'workflow_dispatch' && inputs.export_images
        run: docker save "$IMAGE" | gzip -1 > "$RUNNER_TEMP/$ARCHIVE"
      - name: Upload image archive
        if: github.event_name == 'workflow_dispatch' && inputs.export_images
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: english-practicing-${{ matrix.image }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ env.ARCHIVE }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  required:
    name: CI required
    if: always()
    needs: [python, web, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      PYTHON_RESULT: ${{ needs.python.result }}
      WEB_RESULT: ${{ needs.web.result }}
      DOCKER_RESULT: ${{ needs.docker.result }}
    steps:
      - name: Require all checks to pass (including image builds)
        run: |
          test "$PYTHON_RESULT" = success
          test "$WEB_RESULT" = success
          test "$DOCKER_RESULT" = success
