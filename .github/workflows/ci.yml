name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      export_images:
        description: Save Docker images as downloadable artifacts (uses GitHub storage)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Deliberately fake values: never attach production secrets to PR checks.
      LIVEKIT_URL: wss://test.invalid
      LIVEKIT_API_KEY: ci-placeholder-key
      LIVEKIT_API_SECRET: ci-placeholder-secret
      GROQ_API_KEY: ci-placeholder-groq
      GOOGLE_API_KEY: ci-placeholder-google
      DEEPSEEK_API_KEY: ci-placeholder-deepseek
      TAVILY_API_KEY: ci-placeholder-tavily
      LLM_PROVIDER: groq
      GRADING_PROVIDER: groq
      PROGRESS_DATABASE_URL: ''
      LOG_DIR: logs
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run mocked regression tests
        run: python -m unittest discover -s tests -v

  web:
    name: Web checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_STANDALONE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          package_json_file: web/package.json
          run_install: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Run mocked regression tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Type check (after Next generates its types)
        run: pnpm typecheck

  # PRs/forks/untrusted manual branches: build and test with read-only access.
  docker:
    if: >-
      ${{ github.repository != 'shini3000/EnglishPracticing' ||
          github.event_name == 'pull_request' ||
          !contains(fromJSON('["refs/heads/develop","refs/heads/main","refs/heads/master"]'), github.ref) }}
    name: Docker / ${{ matrix.image }}
    needs: [python, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image: [agent, web]
    env:
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
      IMAGE: english-practicing-${{ matrix.image }}:${{ github.sha }}
      ARCHIVE: english-practicing-${{ matrix.image }}.tar.gz
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build and verify image without production credentials
        env:
          IMAGE_KIND: ${{ matrix.image }}
        run: bash .github/scripts/build-image.sh "$IMAGE_KIND"
      - name: Export image for manual download
        if: github.event_name == 'workflow_dispatch' && inputs.export_images
        run: docker save "$IMAGE" | gzip -1 > "$RUNNER_TEMP/$ARCHIVE"
      - name: Upload image archive
        if: github.event_name == 'workflow_dispatch' && inputs.export_images
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: english-practicing-${{ matrix.image }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ env.ARCHIVE }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # Trusted branch pushes: test both exact images BEFORE exposing the publish token.
  publish:
    name: Publish GHCR
    if: >-
      ${{ github.repository == 'shini3000/EnglishPracticing' &&
          github.event_name != 'pull_request' &&
          contains(fromJSON('["refs/heads/develop","refs/heads/main","refs/heads/master"]'), github.ref) }}
    needs: [python, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
      CHANNEL: ${{ github.ref_name }}
      DOCKER_CONFIG: /tmp/english-practicing-ghcr
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build and verify agent without production credentials
        run: bash .github/scripts/build-image.sh agent
      - name: Build and verify web without production credentials
        run: bash .github/scripts/build-image.sh web
      - name: Authenticate to GHCR (temporary GitHub token, never a build argument)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Publish the verified images
        run: |
          # Upload both commit tags first. Channel tags are updated afterwards.
          for kind in agent web; do
            target="ghcr.io/shini3000/english-practicing-$kind"
            docker tag "english-practicing-$kind:$GITHUB_SHA" "$target:sha-$GITHUB_SHA"
            docker push "$target:sha-$GITHUB_SHA"
          done
          for kind in agent web; do
            target="ghcr.io/shini3000/english-practicing-$kind"
            docker tag "english-practicing-$kind:$GITHUB_SHA" "$target:$CHANNEL"
            docker push "$target:$CHANNEL"
            printf '\nPublished %s:%s\n' "$target" "$CHANNEL"
          done
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
      - name: Export images for manual download
        if: github.event_name == 'workflow_dispatch' && inputs.export_images
        run: |
          for kind in agent web; do
            docker save "english-practicing-$kind:$GITHUB_SHA" |
              gzip -1 > "$RUNNER_TEMP/english-practicing-$kind.tar.gz"
          done
      - name: Upload image archives
        if: github.event_name == 'workflow_dispatch' && inputs.export_images
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: english-practicing-images-${{ github.sha }}
          path: ${{ runner.temp }}/english-practicing-*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  required:
    name: CI required
    if: always()
    needs: [python, web, docker, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      PYTHON_RESULT: ${{ needs.python.result }}
      WEB_RESULT: ${{ needs.web.result }}
      DOCKER_RESULT: ${{ needs.docker.result }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
    steps:
      - name: Require all checks to pass (including image builds)
        run: |
          test "$PYTHON_RESULT" = success
          test "$WEB_RESULT" = success
          if [ "$DOCKER_RESULT" = success ]; then
            test "$PUBLISH_RESULT" = skipped
          else
            test "$DOCKER_RESULT" = skipped
            test "$PUBLISH_RESULT" = success
          fi
